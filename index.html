const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("ar-EG", { maximumFractionDigits: 2 });
const money = (n) => fmt(n) + " ج.م";
const toLatinDigits = (s) => String(s).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const norm = (s) => toLatinDigits(s).toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
const clone = (o) => JSON.parse(JSON.stringify(o));
const collator = new Intl.Collator("ar", { numeric: true });

$("root").appendChild($("shell").content.cloneNode(true));

const data = JSON.parse($("site-data").textContent);
let P = [], byId = {}, catMap = {}, subMap = {}, cnt = { cat: {}, sub: {} };

function buildIndex() {
  catMap = Object.fromEntries(data.cats.map((c, i) => [c.id, { ...c, order: i }]));
  subMap = Object.fromEntries(data.subs.map((s, i) => [s.id, { ...s, order: i }]));
  P = data.products
    .filter((p) => !p.hidden && catMap[p.cat] && subMap[p.sub] && subMap[p.sub].cat === p.cat)
    .map((p) => ({ ...p, _k: norm(p.name + " " + p.sku) }));
  P.sort((a, b) => catMap[a.cat].order - catMap[b.cat].order || subMap[a.sub].order - subMap[b.sub].order || collator.compare(a.name, b.name));
  byId = Object.fromEntries(P.map((p) => [p.sku, p]));
  cnt = { cat: {}, sub: {} };
  P.forEach((p) => { cnt.cat[p.cat] = (cnt.cat[p.cat] || 0) + 1; cnt.sub[p.sub] = (cnt.sub[p.sub] || 0) + 1; });
}
buildIndex();
const usedCats = () => data.cats.filter((c) => cnt.cat[c.id]);
const usedSubs = (catId) => data.subs.filter((s) => s.cat === catId && cnt.sub[s.id]);

let cart = {};
let sel = { cat: null, sub: null };
let query = "";
let placed = null;
const draft = { name: "", phone: "", address: "", notes: "" };

try { cart = JSON.parse(localStorage.getItem("edge-cart") || "{}"); } catch (e) { cart = {}; }
Object.keys(cart).forEach((k) => { if (!byId[k] || !(cart[k] > 0)) delete cart[k]; });
function save() { try { localStorage.setItem("edge-cart", JSON.stringify(cart)); } catch (e) {} }

function totals() {
  let n = 0, lines = 0, sum = 0, all = true;
  for (const k in cart) {
    const p = byId[k];
    n += cart[k]; lines++;
    if (p.price > 0) sum += cart[k] * p.price; else all = false;
  }
  return { n, lines, sum, all };
}
function setQty(sku, q) {
  if (q <= 0) delete cart[sku]; else cart[sku] = Math.min(q, 9999);
  placed = null;
  save();
  render();
}

function headRender() {
  $("brandName").textContent = data.settings.storeName;
  $("tagline").textContent = data.settings.tagline;
  $("notice").textContent = data.settings.notice || "";
  $("notice").hidden = !data.settings.notice;
  $("statN").textContent = fmt(P.length) + " صنف";
  $("statG").textContent = fmt(usedCats().length) + " مجموعة أساسية";
}

function stepperHtml(sku, q) {
  return `<div class="stepper"><button type="button" data-act="dec" data-sku="${esc(sku)}" aria-label="تقليل">−</button><output aria-live="polite">${fmt(q)}</output><button type="button" data-act="inc" data-sku="${esc(sku)}" aria-label="زيادة">+</button></div>`;
}

/* ---------- المجموعات ---------- */
function treeRender() {
  $("tree").innerHTML = `<button type="button" class="tr-main${!sel.cat ? " on" : ""}" data-g="all"><span>كل المجموعات</span><span class="n">${fmt(P.length)}</span></button>` +
    usedCats().map((c) => {
      const on = sel.cat === c.id;
      let h = `<button type="button" class="tr-main${on && !sel.sub ? " on" : ""}${on ? " open" : ""}" data-g="cat" data-cat="${esc(c.id)}" aria-expanded="${on}"><span>${esc(c.name)}</span><span class="n">${fmt(cnt.cat[c.id])}</span></button>`;
      if (on) h += usedSubs(c.id).map((s) => `<button type="button" class="tr-sub${sel.sub === s.id ? " on" : ""}" data-g="sub" data-cat="${esc(c.id)}" data-sub="${esc(s.id)}"><span>${esc(s.name)}</span><span class="n">${fmt(cnt.sub[s.id])}</span></button>`).join("");
      return h;
    }).join("");
}
function chipsRender() {
  $("chips").innerHTML = `<button type="button" class="chip" data-g="all" aria-pressed="${!sel.cat}">الكل</button>` +
    usedCats().map((c) => `<button type="button" class="chip" data-g="cat" data-cat="${esc(c.id)}" aria-pressed="${sel.cat === c.id}">${esc(c.name)}</button>`).join("");
  const sc = $("subchips");
  sc.hidden = !sel.cat;
  sc.innerHTML = sel.cat
    ? `<button type="button" class="chip sm" data-g="cat" data-cat="${esc(sel.cat)}" aria-pressed="${!sel.sub}">كل ${esc(catMap[sel.cat].name)}</button>` +
      usedSubs(sel.cat).map((s) => `<button type="button" class="chip sm" data-g="sub" data-cat="${esc(sel.cat)}" data-sub="${esc(s.id)}" aria-pressed="${sel.sub === s.id}">${esc(s.name)}</button>`).join("")
    : "";
}

function rowHtml(p, showPath) {
  const q = cart[p.sku] || 0;
  const meta = [];
  if (showPath) meta.push(esc(catMap[p.cat].name) + " › " + esc(subMap[p.sub].name));
  if (p.pcs) meta.push((p.unit ? esc(p.unit) + " " : "") + fmt(p.pcs) + " عبوة");
  else if (p.unit) meta.push(esc(p.unit));
  if (p.price > 0) meta.push(money(p.price));
  return `<div class="row${q ? " in" : ""}"><span class="sku">${esc(p.sku)}</span><div><div class="nm">${esc(p.name)}</div>${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}</div><div>${q ? stepperHtml(p.sku, q) : `<button type="button" class="add" data-act="add" data-sku="${esc(p.sku)}">ضيف</button>`}</div></div>`;
}

function paneRender() {
  const crumb = $("crumb"), list = $("list");
  const term = norm(query.trim());
  if (term) {
    const toks = term.split(/\s+/);
    const res = P.filter((p) => toks.every((t) => p._k.includes(t)));
    crumb.innerHTML = `<span class="cur">نتائج البحث</span><span class="cnt">${fmt(res.length)} صنف</span>`;
    list.innerHTML = res.length
      ? `<div class="rows">${res.slice(0, 200).map((p) => rowHtml(p, true)).join("")}</div>` + (res.length > 200 ? `<p class="hint">ظاهر أول ٢٠٠ نتيجة من ${fmt(res.length)}. اكتب كلمة أدق.</p>` : "")
      : `<div class="empty">مفيش صنف بالاسم ده. جرّب كلمة تانية.</div>`;
    return;
  }
  if (!sel.cat) {
    crumb.innerHTML = `<span class="cur">كل المجموعات</span><span class="cnt">${fmt(P.length)} صنف</span>`;
    list.innerHTML = P.length ? `<div class="gcards">${usedCats().map((c) => {
      const subs = usedSubs(c.id);
      return `<button type="button" class="gcard" data-g="cat" data-cat="${esc(c.id)}"><b>${esc(c.name)}</b><span class="m">${fmt(subs.length)} فرعية · ${fmt(cnt.cat[c.id])} صنف</span><span class="s">${subs.slice(0, 4).map((s) => esc(s.name)).join(" · ")}</span></button>`;
    }).join("")}</div>` : `<div class="empty">لسه ما فيش أصناف.</div>`;
    return;
  }
  const c = catMap[sel.cat];
  const parts = [`<button type="button" data-g="all">كل المجموعات</button>`, `<span class="sep">›</span>`];
  parts.push(sel.sub ? `<button type="button" data-g="cat" data-cat="${esc(c.id)}">${esc(c.name)}</button><span class="sep">›</span><span class="cur">${esc(subMap[sel.sub].name)}</span>` : `<span class="cur">${esc(c.name)}</span>`);
  parts.push(`<span class="cnt">${fmt(sel.sub ? cnt.sub[sel.sub] : cnt.cat[sel.cat])} صنف</span>`);
  crumb.innerHTML = parts.join("");
  if (sel.sub) {
    list.innerHTML = `<div class="rows">${P.filter((p) => p.sub === sel.sub).map((p) => rowHtml(p, false)).join("")}</div>`;
  } else {
    list.innerHTML = usedSubs(c.id).map((s) => `<section><h3 class="sub-h"><button type="button" data-g="sub" data-cat="${esc(c.id)}" data-sub="${esc(s.id)}">${esc(s.name)}</button><span class="cnt">${fmt(cnt.sub[s.id])} صنف</span></h3><div class="rows">${P.filter((p) => p.sub === s.id).map((p) => rowHtml(p, false)).join("")}</div></section>`).join("");
  }
}

function navRender(scroll) {
  treeRender();
  chipsRender();
  paneRender();
  if (scroll) {
    const r = $("pane").getBoundingClientRect();
    if (r.top < 0) $("pane").scrollIntoView({ block: "start" });
  }
}

/* ---------- السلة ---------- */
function orderText(ref, f) {
  const t = totals();
  const lines = Object.keys(cart).map((k) => {
    const p = byId[k];
    return `• ${p.name} (${p.sku}) × ${fmt(cart[k])}${p.unit ? " " + p.unit : ""}${p.price > 0 ? " = " + money(cart[k] * p.price) : ""}`;
  });
  return [
    `طلب جديد من ${data.settings.storeName}`,
    `رقم الطلب: ${ref}`,
    `الاسم: ${f.name}`,
    `الموبايل: ${f.phone}`,
    `العنوان: ${f.address}`,
    "",
    ...lines,
    "",
    t.all ? `الإجمالي: ${money(t.sum)}` : `عدد الأصناف: ${fmt(t.lines)} (الأسعار بتتأكد مع المندوب)`,
    f.notes ? `ملاحظات: ${f.notes}` : ""
  ].filter((l, i, a) => !(l === "" && a[i - 1] === "")).join("\n").trim();
}

function cartRender() {
  const t = totals();
  const body = $("cartBody");
  if (placed) {
    const wa = data.settings.whatsapp ? `https://wa.me/${encodeURIComponent(data.settings.whatsapp)}?text=${encodeURIComponent(placed.text)}` : "";
    body.innerHTML = `<div class="done">
      <h3>الطلب جاهز للإرسال</h3>
      <div>رقم الطلب <span class="ref">${esc(placed.ref)}</span></div>
      <p class="hint">الطلب لسه ما اتبعتش. ابعته لنا من الزر تحت أو انسخه وابعته على واتساب.</p>
      <textarea id="orderText" readonly dir="rtl" aria-label="نص الطلب"></textarea>
      <div class="btns">
        ${wa ? `<a class="btn primary" href="${esc(wa)}" target="_blank" rel="noopener">ابعت الطلب على واتساب</a>` : ""}
        <button type="button" class="btn ${wa ? "" : "primary"}" data-act="copy">انسخ الطلب</button>
        <button type="button" class="btn" data-act="new">طلب جديد</button>
      </div>
      <p class="hint" id="copyMsg" role="status"></p>
    </div>`;
    $("orderText").value = placed.text;
    return;
  }
  if (!t.n) { body.innerHTML = `<div class="cart-empty">السلة فاضية. اختار أصناف من القايمة.</div>`; return; }
  body.innerHTML = `<ul class="lines">${Object.keys(cart).map((k) => {
    const p = byId[k];
    return `<li class="line"><div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.sku)} · ${esc(subMap[p.sub].name)}</div></div>
      <div class="tot">${p.price > 0 ? money(cart[k] * p.price) : ""}</div>
      <div class="ctl">${stepperHtml(k, cart[k])}<button type="button" class="rm" data-act="rm" data-sku="${esc(k)}">شيل</button></div></li>`;
  }).join("")}</ul>
  <div class="sum"><span>${fmt(t.lines)} صنف · ${fmt(t.n)} وحدة</span>${t.all ? `<strong>${money(t.sum)}</strong>` : `<small>السعر بيتأكد مع المندوب</small>`}</div>
  <form class="order" id="orderForm" novalidate>
    <div class="field"><label for="f-name">الاسم / اسم المحل</label><input id="f-name" name="name" autocomplete="name"><div class="err" id="e-name"></div></div>
    <div class="field"><label for="f-phone">رقم الموبايل</label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" dir="ltr" style="text-align:right"><div class="err" id="e-phone"></div></div>
    <div class="field"><label for="f-address">عنوان التوصيل</label><textarea id="f-address" name="address" autocomplete="street-address"></textarea><div class="err" id="e-address"></div></div>
    <div class="field"><label for="f-notes">ملاحظات (اختياري)</label><input id="f-notes" name="notes"></div>
    <button class="submit" type="submit">تأكيد الطلب</button>
  </form>`;
  ["name", "phone", "address", "notes"].forEach((k) => {
    const el = $("f-" + k);
    el.value = draft[k];
    el.addEventListener("input", () => { draft[k] = el.value; el.removeAttribute("aria-invalid"); const e = $("e-" + k); if (e) e.textContent = ""; });
  });
}

function barRender() {
  const t = totals();
  $("barCount").textContent = t.n ? `السلة (${fmt(t.lines)} صنف)` : "السلة فاضية";
  $("barTotal").textContent = t.n && t.all ? money(t.sum) : "";
}

function render() {
  const active = document.activeElement;
  const key = active && active.dataset && active.dataset.act ? `[data-act="${active.dataset.act}"][data-sku="${active.dataset.sku}"]` : null;
  const inCart = active && active.closest && active.closest("#cart");
  paneRender();
  const keepFormFocus = active && active.id && /^f-/.test(active.id);
  if (!keepFormFocus) cartRender();
  barRender();
  if (key && !placed) {
    const root = inCart ? $("cart") : $("list");
    const el = root.querySelector(key) || document.querySelector(key);
    if (el) el.focus();
  }
}

function openCart(open) {
  $("cart").classList.toggle("open", open);
  $("scrim").hidden = !open;
}

async function copyOrder() {
  const ta = $("orderText");
  const msg = $("copyMsg");
  try {
    await navigator.clipboard.writeText(placed.text);
    msg.textContent = "تم نسخ الطلب.";
  } catch (err) {
    ta.focus(); ta.select();
    msg.textContent = "حدد النص وانسخه يدويًا.";
  }
}

/* ===================== إدارة الموقع (للمحرر فقط) ===================== */
let adm = null; // { d, tab, editing, dirty, delAsk, closeAsk, busy, f:{q,cat,sub}, more }
const subsIn = (d, catId) => d.subs.filter((s) => s.cat === catId);
const catNameD = (d, id) => (d.cats.find((c) => c.id === id) || {}).name || "";
const subNameD = (d, id) => (d.subs.find((s) => s.id === id) || {}).name || "";
const newId = (p) => p + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);

function normWa(s) {
  let d = toLatinDigits(s).replace(/\D/g, "").replace(/^00/, "");
  if (/^01[0125]\d{8}$/.test(d)) d = "20" + d.slice(1);
  return d;
}

async function publishSite(next) {
  const artifact = await window.claude.use("artifact");
  if (!artifact) throw { code: "not_granted" };
  const reset = [...document.querySelectorAll("style:not(#app-css)")].map((s) => s.textContent).find((t) => t.includes("safe-area-inset"));
  if (!reset) throw { code: "no_reset" };
  const json = JSON.stringify(next).replace(/</g, "\\u003c");
  const end = "<" + "/script>";
  const html = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" +
    "<title>" + TITLE + "</title>" + META_FIT +
    '<style id="app-css">' + $("app-css").textContent + "</style>" + FONT_LINKS +
    '<template id="shell">' + $("shell").innerHTML + "</template>" +
    '<div id="root"></div>' +
    '<script type="application/json" id="site-data">' + json + end +
    '<script id="app-js">' + $("app-js").textContent + end +
    "</body></html>";
  return artifact.publish(html);
}

function setStatus(msg, bad) {
  const el = $("adStatus");
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle("bad", !!bad);
}
function markDirty() { adm.dirty = true; adm.closeAsk = false; setStatus("في تغييرات لسه ما اتنشرتش."); }

function openAdmin() {
  adm = { d: clone(data), tab: "products", editing: null, dirty: false, delAsk: null, closeAsk: false, busy: false, f: { q: "", cat: "", sub: "" }, more: 1 };
  $("admin").hidden = false;
  adminRender();
}
function closeAdmin() {
  if (adm && adm.dirty && !adm.closeAsk) { adm.closeAsk = true; setStatus("في تغييرات ما اتحفظتش. دوس إغلاق تاني لو عايز تلغيها.", true); return; }
  $("admin").hidden = true;
  adm = null;
}

function nextSku() {
  let max = 0;
  adm.d.products.forEach((p) => { if (/^\d+$/.test(p.sku)) max = Math.max(max, +p.sku); });
  return String(max + 1);
}

function productFormHtml() {
  const d = adm.d;
  const isNew = adm.editing === "__new";
  const e = isNew ? null : d.products.find((p) => p.sku === adm.editing);
  const v = e || { sku: "", cat: adm.f.cat || (d.cats[0] || {}).id || "", sub: adm.f.sub || "", name: "", pcs: "", unit: "", price: "", hidden: false };
  const subs = subsIn(d, v.cat);
  const subSel = subs.some((s) => s.id === v.sub) ? v.sub : (subs[0] || {}).id;
  return `<form class="ad-form" id="pform" novalidate>
    <div class="field wide"><label for="p-name">اسم الصنف</label><input id="p-name" value="${esc(v.name)}"></div>
    <div class="field"><label for="p-cat">المجموعة الأساسية</label><select id="p-cat">${d.cats.map((c) => `<option value="${esc(c.id)}"${c.id === v.cat ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div class="field"><label for="p-sub">المجموعة الفرعية</label><select id="p-sub">${subs.map((s) => `<option value="${esc(s.id)}"${s.id === subSel ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
    <div class="field"><label for="p-sku">الكود (سيبه فاضي ويتكتب لوحده)</label><input id="p-sku" dir="ltr" value="${esc(v.sku)}" style="text-align:right"></div>
    <div class="field"><label for="p-unit">وحدة البيع (اختياري)</label><input id="p-unit" value="${esc(v.unit || "")}" placeholder="كرتونة، علبة…"></div>
    <div class="field"><label for="p-pcs">عدد العبوات في الوحدة (اختياري)</label><input id="p-pcs" type="number" min="1" step="1" inputmode="numeric" value="${esc(v.pcs || "")}"></div>
    <div class="field"><label for="p-price">سعر الوحدة بالجنيه (اختياري)</label><input id="p-price" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(v.price || "")}"></div>
    <div class="field check wide"><input id="p-hidden" type="checkbox"${v.hidden ? " checked" : ""}><label for="p-hidden" style="margin:0">مخفي عن العملاء</label></div>
    <div class="wide" id="p-err" style="color:var(--danger);font-size:13px"></div>
    <div class="wide row2"><button type="submit" class="ad-btn main">${e ? "حفظ التعديل" : "إضافة الصنف"}</button><button type="button" class="ad-btn" data-ad="pcancel">إلغاء</button></div>
  </form>`;
}

function adminFiltered() {
  const f = adm.f;
  const toks = norm(f.q.trim()).split(/\s+/).filter(Boolean);
  return adm.d.products.filter((p) => (!f.cat || p.cat === f.cat) && (!f.sub || p.sub === f.sub) && (!toks.length || toks.every((t) => norm(p.name + " " + p.sku).includes(t))));
}
function adminListRender() {
  const d = adm.d;
  const all = adminFiltered();
  const shown = all.slice(0, 50 * adm.more);
  $("adCount").textContent = `${fmt(all.length)} صنف${all.length !== d.products.length ? " من " + fmt(d.products.length) : ""}`;
  $("adList").innerHTML = shown.length ? shown.map((p) => `<li class="ad-row${p.hidden ? " off" : ""}">
      <div class="info"><span class="sku">${esc(p.sku)}</span> <b>${esc(p.name)}</b> ${p.hidden ? '<span class="badge">مخفي</span>' : ""}
        <div class="sub">${esc(catNameD(d, p.cat) || "بدون مجموعة")} › ${esc(subNameD(d, p.sub) || "—")}${p.price > 0 ? " · " + money(p.price) : ""}</div></div>
      <div class="ad-act">
        <button type="button" class="ad-btn sm" data-ad="pedit" data-sku="${esc(p.sku)}">تعديل</button>
        <button type="button" class="ad-btn sm" data-ad="phide" data-sku="${esc(p.sku)}">${p.hidden ? "إظهار" : "إخفاء"}</button>
        <button type="button" class="ad-btn sm danger" data-ad="pdel" data-sku="${esc(p.sku)}">${adm.delAsk === p.sku ? "تأكيد الحذف" : "حذف"}</button>
      </div></li>`).join("") + (all.length > shown.length ? `<li><button type="button" class="ad-btn" data-ad="more">عرض المزيد (${fmt(all.length - shown.length)})</button></li>` : "")
    : '<li class="empty">ما فيش أصناف بالفلتر ده.</li>';
}

function adminRender() {
  const d = adm.d;
  let body = "";
  if (adm.tab === "products") {
    const subsF = adm.f.cat ? subsIn(d, adm.f.cat) : [];
    body += `<div class="ad-bar"><button type="button" class="ad-btn main" data-ad="padd">+ صنف جديد</button>
      <input id="a-q" type="search" placeholder="بحث بالاسم أو الكود" aria-label="بحث" value="${esc(adm.f.q)}">
      <select id="a-cat" aria-label="المجموعة الأساسية"><option value="">كل المجموعات</option>${d.cats.map((c) => `<option value="${esc(c.id)}"${adm.f.cat === c.id ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
      <select id="a-sub" aria-label="المجموعة الفرعية"${adm.f.cat ? "" : " disabled"}><option value="">كل الفرعية</option>${subsF.map((s) => `<option value="${esc(s.id)}"${adm.f.sub === s.id ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>`;
    if (adm.editing) body += productFormHtml();
    body += `<p class="hint" id="adCount"></p><ul class="ad-list" id="adList"></ul>`;
  } else {
    const pc = {}, ps = {};
    d.products.forEach((p) => { pc[p.cat] = (pc[p.cat] || 0) + 1; ps[p.sub] = (ps[p.sub] || 0) + 1; });
    body += `<h3 class="ad-sec">بيانات الموقع</h3><div class="ad-grid">
      <div class="field"><label for="s-name">اسم الشركة</label><input id="s-name" value="${esc(d.settings.storeName)}"></div>
      <div class="field"><label for="s-tag">جملة تحت الاسم</label><textarea id="s-tag">${esc(d.settings.tagline)}</textarea></div>
      <div class="field"><label for="s-wa">رقم واتساب لاستقبال الطلبات</label><input id="s-wa" dir="ltr" style="text-align:right" inputmode="tel" placeholder="01xxxxxxxxx" value="${esc(d.settings.whatsapp)}"><div class="hint">لو سيبته فاضي، العميل هيقدر ينسخ الطلب بس.</div></div>
      <div class="field"><label for="s-notice">تنبيه أعلى الصفحة (سيبه فاضي لو مش عايز تنبيه)</label><input id="s-notice" value="${esc(d.settings.notice)}"></div></div>
      <h3 class="ad-sec">المجموعات الأساسية والفرعية</h3>` +
      d.cats.map((c) => `<div class="ad-grp"><div class="ad-grp-h"><input class="m-name" data-id="${esc(c.id)}" value="${esc(c.name)}" aria-label="اسم المجموعة الأساسية"><span class="badge">${fmt(pc[c.id] || 0)} صنف</span><button type="button" class="ad-btn sm danger" data-ad="mdel" data-id="${esc(c.id)}">حذف</button></div>
        <ul class="ad-subs">${subsIn(d, c.id).map((s) => `<li><input class="s-name" data-id="${esc(s.id)}" value="${esc(s.name)}" aria-label="اسم المجموعة الفرعية"><span class="badge">${fmt(ps[s.id] || 0)}</span><button type="button" class="ad-btn sm danger" data-ad="sdel" data-id="${esc(s.id)}">حذف</button></li>`).join("")}</ul>
        <div class="ad-add"><input class="s-new" data-cat="${esc(c.id)}" placeholder="مجموعة فرعية جديدة" aria-label="مجموعة فرعية جديدة"><button type="button" class="ad-btn sm main" data-ad="sadd" data-cat="${esc(c.id)}">+ فرعية</button></div></div>`).join("") +
      `<div class="ad-form"><div class="field wide"><label for="m-new">مجموعة أساسية جديدة</label><input id="m-new"></div><div class="wide"><button type="button" class="ad-btn main" data-ad="madd">إضافة مجموعة أساسية</button></div></div>`;
  }
  $("adminBody").innerHTML = `<div class="ad-head"><h2>إدارة الموقع</h2>
      <button type="button" class="ad-btn" data-ad="close">إغلاق</button>
      <button type="button" class="ad-btn main" data-ad="save" id="adSave">حفظ ونشر</button>
      <div class="ad-status" id="adStatus" role="status"></div></div>
    <div class="ad-tabs" role="tablist">
      <button type="button" class="ad-tab" role="tab" data-ad="tab" data-tab="products" aria-selected="${adm.tab === "products"}">الأصناف</button>
      <button type="button" class="ad-tab" role="tab" data-ad="tab" data-tab="groups" aria-selected="${adm.tab === "groups"}">المجموعات والإعدادات</button></div>${body}`;
  if (adm.tab === "products") adminListRender();
  if (adm.dirty) setStatus("في تغييرات لسه ما اتنشرتش.");
  else setStatus("التعديلات مش هتظهر للعملاء إلا بعد \"حفظ ونشر\".");
}

function submitProduct() {
  const d = adm.d;
  const g = (id) => $(id);
  const err = (m) => { g("p-err").textContent = m; };
  const name = g("p-name").value.trim();
  const catId = g("p-cat").value;
  const subId = g("p-sub").value;
  let sku = toLatinDigits(g("p-sku").value).trim().replace(/\s+/g, "-");
  const pcsRaw = toLatinDigits(g("p-pcs").value).trim();
  const priceRaw = toLatinDigits(g("p-price").value).trim();
  if (!name) return err("اكتب اسم الصنف.");
  if (!catId || !subId) return err("اختار المجموعة الأساسية والفرعية. لو مفيش فرعية، ضيفها من تبويب المجموعات.");
  let pcs, price;
  if (pcsRaw) { pcs = Math.floor(Number(pcsRaw)); if (!(pcs >= 1)) return err("عدد العبوات لازم يكون ١ أو أكتر."); }
  if (priceRaw) { price = Number(priceRaw); if (!(price > 0)) return err("السعر لازم يكون أكبر من صفر، أو سيبه فاضي."); }
  if (!sku) sku = nextSku();
  if (d.products.some((p) => p.sku === sku && p.sku !== adm.editing)) return err("الكود ده مستخدم في صنف تاني.");
  const item = { sku, name, cat: catId, sub: subId };
  const unit = g("p-unit").value.trim();
  if (unit) item.unit = unit;
  if (pcs) item.pcs = pcs;
  if (price) item.price = price;
  if (g("p-hidden").checked) item.hidden = true;
  if (adm.editing === "__new") d.products.unshift(item);
  else { const i = d.products.findIndex((p) => p.sku === adm.editing); if (i >= 0) d.products[i] = item; }
  adm.editing = null;
  markDirty();
  adminRender();
}

async function saveAdmin() {
  if (adm.busy) return;
  const d = adm.d;
  d.settings.storeName = d.settings.storeName.trim();
  if (!d.settings.storeName) { setStatus("اسم الشركة مطلوب.", true); return; }
  d.cats.forEach((c) => { c.name = c.name.trim(); });
  d.subs.forEach((s) => { s.name = s.name.trim(); });
  if (d.cats.some((c) => !c.name) || d.subs.some((s) => !s.name)) { setStatus("في مجموعة اسمها فاضي. اكتب اسمها أو احذفها.", true); return; }
  adm.busy = true;
  $("adSave").disabled = true;
  setStatus("جاري النشر…");
  d.settings.whatsapp = normWa(d.settings.whatsapp);
  try {
    await publishSite(d);
    setStatus("اتنشر. الصفحة بتتحدث…");
  } catch (e) {
    adm.busy = false;
    const sv = $("adSave"); if (sv) sv.disabled = false;
    const c = e && e.code;
    if (c === "not_writer" || c === "not_granted" || c === "not_declared") setStatus("ما عندكش صلاحية تعديل الموقع.", true);
    else if (c === "conflict") setStatus("حد نشر نسخة أحدث. الصفحة هتتحدث، وهتحتاج تعيد التعديل.", true);
    else if (c === "rate_limited") setStatus("استنى شوية وجرّب تاني.", true);
    else if (c === "too_large") setStatus("حجم الموقع كبير أوي. قلل الأصناف أو النصوص.", true);
    else setStatus("ما اتنشرش. جرّب تاني.", true);
  }
}

document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-g]");
  if (g) {
    const k = g.dataset.g;
    if (k === "all") sel = { cat: null, sub: null };
    else if (k === "cat") sel = { cat: g.dataset.cat, sub: null };
    else sel = { cat: g.dataset.cat, sub: g.dataset.sub };
    if (query) { query = ""; $("q").value = ""; }
    navRender(true);
    return;
  }
  const b = e.target.closest("[data-act]");
  if (b) {
    const sku = b.dataset.sku;
    const act = b.dataset.act;
    if (act === "add") setQty(sku, 1);
    else if (act === "inc") setQty(sku, (cart[sku] || 0) + 1);
    else if (act === "dec") setQty(sku, (cart[sku] || 0) - 1);
    else if (act === "rm") setQty(sku, 0);
    else if (act === "new") { cart = {}; placed = null; draft.notes = ""; save(); render(); }
    else if (act === "copy") copyOrder();
    return;
  }
  const a = e.target.closest("[data-ad]");
  if (!a || !adm) return;
  const k = a.dataset.ad;
  const d = adm.d;
  if (k === "close") closeAdmin();
  else if (k === "save") saveAdmin();
  else if (k === "tab") { adm.tab = a.dataset.tab; adm.editing = null; adminRender(); }
  else if (k === "padd") { adm.editing = "__new"; adminRender(); $("p-name").focus(); }
  else if (k === "pedit") { adm.editing = a.dataset.sku; adminRender(); $("p-name").focus(); $("pform").scrollIntoView({ block: "center" }); }
  else if (k === "pcancel") { adm.editing = null; adminRender(); }
  else if (k === "more") { adm.more++; adminListRender(); }
  else if (k === "phide") { const p = d.products.find((x) => x.sku === a.dataset.sku); if (p) { if (p.hidden) delete p.hidden; else p.hidden = true; markDirty(); adminListRender(); } }
  else if (k === "pdel") {
    if (adm.delAsk === a.dataset.sku) { d.products = d.products.filter((x) => x.sku !== a.dataset.sku); adm.delAsk = null; markDirty(); }
    else adm.delAsk = a.dataset.sku;
    adminListRender();
  }
  else if (k === "madd") {
    const name = $("m-new").value.trim();
    if (!name) { setStatus("اكتب اسم المجموعة.", true); return; }
    d.cats.push({ id: newId("m"), name });
    markDirty(); adminRender();
  }
  else if (k === "sadd") {
    const inp = adm.tab === "groups" ? $("adminBody").querySelector(`.s-new[data-cat="${a.dataset.cat}"]`) : null;
    const name = inp ? inp.value.trim() : "";
    if (!name) { setStatus("اكتب اسم المجموعة الفرعية.", true); return; }
    d.subs.push({ id: newId("s"), cat: a.dataset.cat, name });
    markDirty(); adminRender();
  }
  else if (k === "mdel") {
    if (subsIn(d, a.dataset.id).length) { setStatus("المجموعة دي فيها مجموعات فرعية. احذفها أو انقل أصنافها الأول.", true); return; }
    d.cats = d.cats.filter((c) => c.id !== a.dataset.id); markDirty(); adminRender();
  }
  else if (k === "sdel") {
    if (d.products.some((p) => p.sub === a.dataset.id)) { setStatus("المجموعة الفرعية دي فيها أصناف. انقلها لمجموعة تانية أو احذفها الأول.", true); return; }
    d.subs = d.subs.filter((s) => s.id !== a.dataset.id); markDirty(); adminRender();
  }
});

document.addEventListener("input", (e) => {
  if (!adm) return;
  const t = e.target;
  const map = { "s-name": "storeName", "s-tag": "tagline", "s-wa": "whatsapp", "s-notice": "notice" };
  if (map[t.id]) { adm.d.settings[map[t.id]] = t.value; markDirty(); }
  else if (t.id === "a-q") { adm.f.q = t.value; adm.more = 1; adminListRender(); }
  else if (t.classList && t.classList.contains("m-name")) { const c = adm.d.cats.find((x) => x.id === t.dataset.id); if (c) { c.name = t.value; markDirty(); } }
  else if (t.classList && t.classList.contains("s-name")) { const s = adm.d.subs.find((x) => x.id === t.dataset.id); if (s) { s.name = t.value; markDirty(); } }
});

document.addEventListener("change", (e) => {
  if (!adm) return;
  const t = e.target;
  if (t.id === "p-cat") $("p-sub").innerHTML = subsIn(adm.d, t.value).map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
  else if (t.id === "a-cat") { adm.f.cat = t.value; adm.f.sub = ""; adm.more = 1; adminRender(); }
  else if (t.id === "a-sub") { adm.f.sub = t.value; adm.more = 1; adminListRender(); }
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "pform") { e.preventDefault(); submitProduct(); return; }
  if (e.target.id !== "orderForm") return;
  e.preventDefault();
  const f = { name: draft.name.trim(), phone: toLatinDigits(draft.phone).replace(/[\s-]/g, ""), address: draft.address.trim(), notes: draft.notes.trim() };
  let bad = null;
  const fail = (k, m) => { $("e-" + k).textContent = m; $("f-" + k).setAttribute("aria-invalid", "true"); if (!bad) bad = k; };
  if (!f.name) fail("name", "اكتب الاسم.");
  if (!/^(\+?20|0)?1[0125]\d{8}$/.test(f.phone)) fail("phone", "اكتب رقم موبايل مصري صحيح، مثال 01012345678.");
  if (f.address.length < 6) fail("address", "اكتب العنوان بالتفصيل.");
  if (bad) { $("f-" + bad).focus(); return; }
  const dt = new Date();
  const ref = "ED-" + String(dt.getFullYear()).slice(2) + String(dt.getMonth() + 1).padStart(2, "0") + String(dt.getDate()).padStart(2, "0") + "-" + Math.floor(100 + Math.random() * 900);
  placed = { ref, text: orderText(ref, f) };
  render();
  $("cart").scrollTop = 0;
  openCart(true);
});

$("q").addEventListener("input", (e) => { query = e.target.value; paneRender(); });
$("openCart").addEventListener("click", () => openCart(true));
$("closeCart").addEventListener("click", () => openCart(false));
$("scrim").addEventListener("click", () => openCart(false));
$("adminBtn").addEventListener("click", openAdmin);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (adm) closeAdmin(); else openCart(false); } });

headRender();
navRender(false);
cartRender();
barRender();

/* زر الإدارة يظهر للمحررين بس */
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const u = await window.claude.use("user");
    if (u && (await u.canEdit())) $("adminBtn").hidden = false;
  } catch (e) {}
})();
</script>
